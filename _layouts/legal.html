<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} — RepSearch</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="theme-color" content="#292a2f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    /* Mirrors mobile/lib/theme.ts (DESIGN.md Layer 3, graphite + indigo). */
    --bg: #292a2f;
    --panel: #35373d;
    --edge: #1d1e22;
    --text: #f6f7f9;
    --sub: #c6c9cf;
    --muted: #9a9ea8;
    --brand-text: #aea4ff;
    --display: "Nunito", ui-rounded, system-ui, sans-serif;
    --body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--sub);
    font-family: var(--body);
    font-size: 17px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: rgba(117, 99, 255, 0.5); }
  a { color: var(--brand-text); }
  a:focus-visible { outline: 3px solid var(--brand-text); outline-offset: 3px; }
  .page { max-width: 720px; margin: 0 auto; padding: 0 20px; }
  .top { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; }
  .wordmark { font-family: var(--display); font-weight: 900; font-size: 22px; letter-spacing: -0.3px; color: var(--text); text-decoration: none; }
  .wordmark span { color: var(--brand-text); }
  main { padding: 20px 0 48px; }
  h1, h2 { font-family: var(--display); color: var(--text); text-wrap: balance; }
  h1 { font-weight: 900; font-size: clamp(30px, 5vw, 40px); line-height: 1.1; letter-spacing: -0.6px; }
  h2 { font-weight: 800; font-size: 22px; line-height: 1.2; letter-spacing: -0.2px; margin-top: 40px; }
  p, ul, ol { margin-top: 14px; }
  ul, ol { padding-left: 22px; }
  li + li { margin-top: 8px; }
  strong { color: var(--text); font-weight: 600; }
  em { color: var(--muted); }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.92em; background: var(--panel); padding: 2px 6px; border-radius: 6px; color: var(--text); }
  footer { padding: 28px 0 56px; font-size: 14px; color: var(--muted); box-shadow: 0 -3px 0 var(--edge); }
  footer nav { display: flex; flex-wrap: wrap; gap: 8px 20px; }
  footer p { margin-top: 12px; }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <a class="wordmark" href="../">Rep<span>Search</span></a>
  </header>
  <main>
{{ content }}
  </main>
  <footer>
    <nav aria-label="Legal">
      <a href="../privacy/">Privacy policy</a>
      <a href="../terms/">Terms of use</a>
      <a href="../disclaimer/">Health disclaimer</a>
      <a href="../account-deletion/">Delete your account</a>
    </nav>
    <p>RepSearch © 2026</p>
  </footer>
</div>
</body>
</html>
